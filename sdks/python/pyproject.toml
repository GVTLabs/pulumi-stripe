[project]
  name = "pulumi_stripe"
  description = "A Pulumi provider dynamically bridged from stripe."
  dependencies = ["packaging>=24.0", "pulumi>=3.269.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  readme = "README.md"
  requires-python = ">=3.9"
  version = "0.3.1"
  [project.urls]
    Repository = "https://github.com/stripe/terraform-provider-stripe"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      pulumi_stripe = ["py.typed", "pulumi-plugin.json"]
